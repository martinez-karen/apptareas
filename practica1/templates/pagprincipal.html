<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
       <style>
        body {
            background-image: url("{{ url_for('static', filename = 'img/principal.jpg')}}") ;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
        }
    </style>
</head>
<style>
    .titulo-app {
        font-size: 40px;
        font-style: oblique;
        color: white;
        font-weight: bold;
    }
</style>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand">PlanifyApp</span>

        <div>
            <a href="#" class="btn btn-outline-light menu-btn">Todas</a>
            <a href="#" class="btn btn-outline-light menu-btn">Pendientes</a>
            <a href="#" class="btn btn-outline-light menu-btn">Completadas</a>
            <a href="#" class="btn btn-success menu-btn">+ Nueva</a>
        </div>
    </div>
</nav>

<body>

<div class="container mt-4">

    <h2 class="text-white mb-4">Mis tareas</h2>

    <!-- FORMULARIO -->
    <div class="card p-4 mb-4">

        <form method="POST">

            <div class="mb-3">
                <input
                    type="text"
                    name="titulo"
                    class="form-control"
                    placeholder="Titulo de la tarea"
                    required
                >
            </div>

            <div class="mb-3">
                <textarea
                    name="descripcion"
                    class="form-control"
                    placeholder="Descripción"
                    required
                ></textarea>
            </div>

            <button class="btn btn-success">
                + Crear tarea
            </button>

        </form>

    </div>

    <!-- TAREAS -->
    {% for tarea in tareas %}

    <div class="card p-3 mb-3">

        <div class="d-flex justify-content-between">

            <div>
                <h4>{{ tarea.titulo }}</h4>

                <p>{{ tarea.descripcion }}</p>

                <small class="text-secondary">
                    {{ tarea.fecha }}
                </small>
            </div>

            <div>

                <form method="POST">

                    <select class="form-select">

                        <option
                        {% if tarea.estado == "Pendiente" %}
                        selected
                        {% endif %}
                        >
                        Pendiente
                        </option>

                        <option
                        {% if tarea.estado == "Completada" %}
                        selected
                        {% endif %}
                        >
                        Completada
                        </option>

                        <option
                        {% if tarea.estado == "Cancelada" %}
                        selected
                        {% endif %}
                        >
                        Cancelada
                        </option>

                    </select>

                </form>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
