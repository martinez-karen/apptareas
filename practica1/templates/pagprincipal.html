<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        body {
            background-image: url("{{ url_for('static', filename = 'img/principal.jpg')}}") ;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
        }
    </style>
</head>
<style>
    .titulo-app {
        font-size: 40px;
        font-style: oblique;
        color: white;
        font-weight: bold;
    }
</style>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand">PlanifyApp</span>

        <div>
            <a href="#" class="btn btn-outline-light menu-btn">Todas</a>
            <a href="#" class="btn btn-outline-light menu-btn">Pendientes</a>
            <a href="#" class="btn btn-outline-light menu-btn">Completadas</a>
            <form action="/agregar" method="POST" class="mb-4">

    <input
        type="text"
        name="texto"
        class="form-control mb-2"
        placeholder="Escribe tu tarea"
        required
    >

    <button class="btn btn-success">
        + Nueva tarea
    </button>

</form>
        </div>
    </div>
</nav>

<body>
{% for tarea in tareas %}

<div class="card p-3 mb-3">

    <h5>{{ tarea.texto }}</h5>

    <small class="text-secondary">
        {{ tarea.fecha }}
    </small>

    <br><br>

    <span class="badge bg-primary">
        {{ tarea.estado }}
    </span>

    <div class="mt-3">

        <a href="/cambiar_estado/{{ tarea._id }}/Pendiente"
            class="btn btn-warning btn-sm">
            Pendiente
        </a>

        <a href="/cambiar_estado/{{ tarea._id }}/Completada"
            class="btn btn-success btn-sm">
            Completada
        </a>

        <a href="/cambiar_estado/{{ tarea._id }}/Cancelada"
            class="btn btn-danger btn-sm">
            Cancelada
        </a>

    </div>

</div>

{% endfor %}


</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
